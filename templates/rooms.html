{% extends "base.html" %}
{% block title %}Rooms{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Rooms</h1>
    <p class="page-subtitle">Classrooms, labs and seminar halls. Mark a room unavailable to trigger the What-If re-optimization demo.</p>
  </div>
  <button class="btn btn-amber" data-bs-toggle="modal" data-bs-target="#roomModal">+ Add Room</button>
</div>

<div class="card card-pad">
  <div class="table-responsive">
    <table class="table table-hover align-middle" id="room-table">
      <thead><tr><th>Room No.</th><th>Building</th><th>Type</th><th>Capacity</th><th>Status</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="roomModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title">Add Room</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <form id="room-form">
      <div class="mb-2"><label class="form-label">Room Number</label><input class="form-control" id="r-number" required></div>
      <div class="mb-2"><label class="form-label">Building</label><input class="form-control" id="r-building" value="Main Block"></div>
      <div class="mb-2"><label class="form-label">Room Type</label>
        <select class="form-select" id="r-type">{% for t in room_types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}</select>
      </div>
      <div class="mb-2"><label class="form-label">Capacity</label><input type="number" min="1" class="form-control" id="r-capacity" value="60" required></div>
    </form>
  </div>
  <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-navy" id="save-room">Save Room</button></div>
</div></div></div>
{% endblock %}
{% block extra_scripts %}<script src="{{ url_for('static', filename='js/rooms.js') }}"></script>{% endblock %}

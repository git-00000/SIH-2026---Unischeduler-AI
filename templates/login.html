<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · Unischeduler AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brandmark">TT</div>
    <h1 style="font-size:1.35rem; margin-bottom:.15rem;">Unischeduler AI</h1>
    <p style="color:var(--ink-soft); font-size:.85rem; margin-bottom:1.4rem;">
      AI timetable generation for NEP 2020 multidisciplinary education.
    </p>

    <div id="login-error" class="alert alert-danger py-2" style="display:none;"></div>

    <form id="login-form">
      <div class="mb-3">
        <label class="form-label" style="font-size:.82rem; font-weight:600;">Username</label>
        <input type="text" class="form-control" id="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" style="font-size:.82rem; font-weight:600;">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <button type="submit" class="btn btn-navy w-100">Sign in</button>
    </form>

    <div class="demo-creds">
      <strong>Demo credentials</strong><br>
      Admin: <code>admin / admin123</code><br>
      Teacher: <code>dr.sharma / teacher123</code><br>
      Student: <code>student1 / student123</code>
    </div>
  </div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errBox = document.getElementById('login-error');
  errBox.style.display = 'none';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      errBox.textContent = data.error || 'Login failed';
      errBox.style.display = 'block';
      return;
    }
    window.location.href = data.redirect || '/dashboard';
  } catch (err) {
    errBox.textContent = 'Could not reach the server.';
    errBox.style.display = 'block';
  }
});
</script>
</body>
</html>
